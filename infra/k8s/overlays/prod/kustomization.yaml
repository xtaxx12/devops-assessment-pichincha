apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base


# El pipeline reemplaza el tag con `kustomize edit set image` antes de aplicar.
images:
- name: ghcr.io/OWNER/devops-service
  newTag: latest
labels:
- includeSelectors: true
  pairs:
    environment: production
